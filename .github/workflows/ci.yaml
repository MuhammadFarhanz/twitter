name: Docker Image Build and Push
on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - "backend/**"
  # workflow_dispatch:
env:
  REGISTRY_REPO: ghcr.io/muhammadfarhanz/twitter
jobs:
  build-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Check Path Changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_REPO }}-frontend:latest
            ${{ env.REGISTRY_REPO }}-frontend:${{ github.sha }}

      - name: Build and Push Backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_REPO }}-backend:latest
            ${{ env.REGISTRY_REPO }}-backend:${{ github.sha }}

      - name: Checkout Gitops Repository
        uses: actions/checkout@v3
        with:
          repository: MuhammadFarhanz/argocd-kubernetes-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
          ref: main

      - name: Update Helm Chart Values
        run: |
          cd gitops/charts/applications/twitter

          # Inject lowercase repo path and commit SHA for Frontend
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
          yq -i '.frontend.image.repository = "${{ env.REGISTRY_REPO }}-frontend"' values.yaml
          yq -i '.frontend.image.tag = "${{ github.sha }}"' values.yaml
          fi

          # Inject lowercase repo path and commit SHA for Backend
          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
          yq -i '.backend.image.repository = "${{ env.REGISTRY_REPO }}-backend"' values.yaml
          yq -i '.backend.image.tag = "${{ github.sha }}"' values.yaml
          fi

      - name: Commit and Push Changes to GitOps Repo
        run: |
          cd gitops
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add charts/applications/twitter/values.yaml
          git commit -m "Updates images to commit ${{ github.sha }}"
          git push origin main
